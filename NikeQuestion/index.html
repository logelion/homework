<!doctype html>
<html class="page" lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/index.css" />
    <link
      rel="shortcut icon"
      href="./content/icons/nike-favicon-48x48.ico"
      type="image/x-icon"
    />
    <script defer src="./js/index.js" type="module"></script>
    <title>Nike Air Mag</title>
  </head>
  <body class="page__body">
    <header class="header header--fixed">
      <div class="container header__container">
        <a href="#" class="logo header__logo">
          <img
            class="logo__img"
            src="./content/icons/nike_logo.svg"
            width="50"
            height="20"
            alt="Логотип Nike"
          />
        </a>
        <nav
          class="menu header__menu"
          id="header__menu"
          aria-label="Главное меню"
        >
          <ul class="menu__list">
            <li class="menu__item">
              <a class="menu__link" href="#air-mag" lang="en">Air Mag</a>
            </li>
            <li class="menu__item">
              <a class="menu__link" href="#sizes">Размеры</a>
            </li>
            <li class="menu__item">
              <a class="menu__link" href="#characteristics">Характеристики</a>
            </li>
            <li class="menu__item">
              <a class="menu__link" href="#top-models">Другие ТОП модели</a>
            </li>
          </ul>
        </nav>
        <div class="header__controls">
          <a class="header__order" href="#">Сделать заказ</a>
          <div class="header__tools header__actions">
            <button
              class="header__tools-button header__actions-button"
              aria-label="Поиск"
              title="Поиск"
            >
              <svg width="24" height="24">
                <use
                  class="header__tools-icon header__actions-icon"
                  href="./content/icons/sprite.svg#search"
                ></use>
              </svg>
            </button>
            <button
              class="header__tools-button header__actions-button"
              aria-label="Корзина"
              title="Корзина"
            >
              <svg width="24" height="24">
                <use
                  class="header__tools-icon header__actions-icon"
                  href="./content/icons/sprite.svg#cart"
                ></use>
              </svg>
            </button>
            <button
              class="header__burger burger"
              aria-label="Открыть меню"
              aria-expanded="false"
              aria-controls="header__menu"
            >
              <svg width="24" height="24">
                <use
                  class="burger__icon-menu"
                  href="./content/icons/sprite.svg#menu-burger"
                ></use>
                <use
                  class="burger__icon-cross"
                  href="./content/icons/sprite.svg#menu-cross"
                ></use>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </header>
    <main class="main">
      <section class="hero">
        <div class="container hero__container">
          <header class="hero__header">
            <ul class="hero__benefits-list">
              <li class="hero__benefits-item">Стиль</li>
              <li class="hero__benefits-item">Скорость</li>
            </ul>
            <h1 class="hero__title">
              Nike <span class="hero__title-accent">air</span> mag
            </h1>
          </header>
          <img
            class="hero__img"
            src="./content/img/Hero_nike.png"
            width="846"
            height="713"
            alt="Кроссовка паленка"
          />
          <footer class="hero__footer">
            <a href="#" class="hero__details"
              >Подробнее
              <svg width="24" height="24">
                <use
                  class="hero__details-icon"
                  href="./content/icons/main-sprite.svg#arrow-right"
                ></use>
              </svg>
            </a>
          </footer>
        </div>
      </section>
    </main>
  </body>
</html>
