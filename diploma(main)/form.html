<!doctype html>
<html class="page" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Форма заполнения</title>
    <link rel="stylesheet" href="./css/base/normalize.css" />
    <link rel="stylesheet" href="./css/base/fonts.css" />
    <link rel="stylesheet" href="./css/form/form.css" />
    <link
      rel="shortcut icon"
      href="./content/icon/karaoke.ico"
      type="image/x-icon"
    />
  </head>
  <body class="page__body">
    <section class="filling">
      <div class="container filling__container">
        <div class="filling__content-wrapper">
          <form class="form">
            <fieldset class="fieldset">
              <legend class="form__title">Ваши данные для записи</legend>
              <div class="form__content-wrapper">
                <label class="label">
                  <span class="form__text">Ваше имя</span>
                  <input
                    class="main_input input_text"
                    name="name"
                    type="text"
                    placeholder="Name"
                    required
                  />
                </label>
                <label class="label">
                  <span class="form__text">Ваш номер</span>
                  <input
                    class="main_input input_text"
                    name="number"
                    type="tel"
                    placeholder="Number"
                    required
                  />
                </label>
                <label class="label">
                  <span class="form__text email">Ваша почта</span>
                  <input
                    class="main_input email_input input_text"
                    name="email"
                    type="email"
                    placeholder="Email"
                    required
                  />
                </label>
              </div>
              <div class="check">
                <label class="check_container">
                  <input
                    class="checkbox"
                    type="checkbox"
                    name="one"
                    value="one"
                    required
                  />
                  <span class="form__text form__accept"
                    >Даю согласию на обработку
                    <a href="https://referest.ru/policy" class="personal"
                      >персональных данных</a
                    ></span
                  >
                </label>
              </div>

              <div class="button">
                <button class="button-send" type="submit">Отправить</button>
              </div>
            </fieldset>
          </form>
        </div>
        <div class="filling__img-wrapper">
          <h2 class="form__title img__title">Ждем Вас!</h2>
          <img
            class="filling-image"
            src="./content/images/karaoke.webp"
            alt="Караоке зал"
          />
        </div>
      </div>
    </section>
  </body>
</html>
